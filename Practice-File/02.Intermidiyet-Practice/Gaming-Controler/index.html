<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaming Controller</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="controller">
      <!-- Left Joystick -->
      <div class="joystick left-joystick"></div>

      <!-- Right Joystick -->
      <div class="joystick right-joystick"></div>

      <!-- D-pad -->
      <div class="dpad">
        <div class="button up"></div>
        <div class="button left"></div>
        <div class="button center"></div>
        <div class="button right"></div>
        <div class="button down"></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <div class="button a"></div>
        <div class="button b"></div>
        <div class="button x"></div>
        <div class="button y"></div>
      </div>

      <!-- Triggers -->
      <div class="trigger left-trigger"></div>
      <div class="trigger right-trigger"></div>

      <!-- Select and Start Buttons -->
      <div class="start-select">
        <div class="button select">Select</div>
        <div class="button start">Start</div>
      </div>
    </div>
  </body>
</html>
