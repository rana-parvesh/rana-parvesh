<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outline about basic to advanced</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Outline Examples</h1>

    <!-- Basic Outline -->
    <div class="basic-outline">Basic Outline</div>

    <!-- Outline with Offset -->
    <div class="outline-offset">Outline with Offset</div>

    <!-- Dotted Outline -->
    <div class="dotted-outline">Dotted Outline</div>

    <!-- Outline on Focus for Accessibility -->
    <input
      type="text"
      class="focus-outline"
      placeholder="Click here to see focus outline"
    />

    <!-- Custom Outline with Color and Width -->
    <div class="custom-outline">Custom Outline (Width, Color, Style)</div>

    <!-- Outline with Shadow Effect -->
    <div class="shadow-outline">Outline with Shadow Effect</div>
  </body>
</html>
