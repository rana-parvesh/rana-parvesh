<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image style basic to advanced</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Basic Image Styling</h2>
    <img src="/images/black git.jpg" alt="Basic Image" class="basic-img" />

    <h2>Rounded Corners</h2>
    <img src="/images/rana.jpg" alt="Rounded Image" class="rounded-img" />
    <img src="/images/rana.jpg" alt="Circular Image" class="circle-img" />

    <h2>Border and Shadow</h2>
    <img
      src="/images/rana.jpg"
      alt="Border and Shadow Image"
      class="border-shadow-img"
    />

    <h2>Hover Effect</h2>
    <img
      src="/images/rana.jpg"
      alt="Hover Effect Image"
      class="hover-effect-img"
    />

    <h2>Overlay Text</h2>
    <div class="overlay-container">
      <img src="/images/rana.jpg" alt="Overlay Image" />
      <div class="overlay-text">Overlay Text</div>
    </div>

    <h2>Grayscale Filter</h2>
    <img src="/images/rana.jpg" alt="Grayscale Image" class="grayscale-img" />

    <h2>Sepia Filter</h2>
    <img src="/images/rana.jpg" alt="Sepia Image" class="sepia-img" />

    <h2>Blend Mode</h2>
    <img src="/images/rana.jpg" alt="Blended Image" class="blend-img" />

    <h2>Animation Effect</h2>
    <img src="/images/rana.jpg" alt="Animated Image" class="animated-img" />

    <h2>Image Reflection Effect</h2>

    <div class="reflection-container">
      <img src="/images/rana.jpg" alt="Original Image" width="200" />
      <img
        src="/images/rana.jpg"
        alt="Reflection Image"
        class="reflection"
        width="200"
      />
    </div>
  </body>
</html>
