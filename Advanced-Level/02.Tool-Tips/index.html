<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic to Advanced tool tips</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Tooltips from Basic to Advanced</h2>

    <!-- Basic Tooltip -->
    <p class="tooltip-basic" title="Basic tooltip from title attribute">
      Hover over me for a basic tooltip.
    </p>

    <!-- Custom Tooltip -->
    <p class="tooltip" data-tooltip="Custom tooltip!">
      Hover over me for a custom tooltip.
    </p>

    <!-- Intermediate Tooltip with Arrow -->
    <p class="tooltip-intermediate" data-tooltip="Tooltip with an arrow!">
      Hover over me for an arrow tooltip.
    </p>

    <!-- Advanced Tooltip with Animation -->
    <p class="tooltip-advanced" data-tooltip="Animated tooltip with delay!">
      Hover over me for an advanced tooltip.
    </p>
  </body>
</html>
