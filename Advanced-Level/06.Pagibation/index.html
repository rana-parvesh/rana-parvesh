<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>basic to advanced pagination</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <ul class="pagination">
      <!-- Disabled Previous Link -->
      <li class="disabled"><a href="#">Previous</a></li>

      <!-- Page Number Links -->
      <li><a href="#">1</a></li>
      <li class="active"><a href="#">2</a></li>
      <li><a href="#">3</a></li>
      <li><a href="#">4</a></li>
      <li><a href="#">5</a></li>

      <!-- Next Link -->
      <li><a href="#">Next</a></li>
    </ul>
  </body>
</html>
