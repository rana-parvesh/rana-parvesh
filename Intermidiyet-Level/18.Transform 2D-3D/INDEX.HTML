<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic to advanced transform?</title>
    \
    <link rel="stylesheet" href="STYLE.CSS" />
  </head>
  <body>
    <h2>2D Transforms</h2>
    <div class="container">
      <div class="box translate">Translate</div>
      <div class="box rotate">Rotate</div>
      <div class="box scale">Scale</div>
      <div class="box skew">Skew</div>
    </div>

    <h2>3D Transforms</h2>
    <div class="container-3d">
      <div class="box rotateX">RotateX</div>
      <div class="box rotateY">RotateY</div>
      <div class="box rotateZ">RotateZ</div>
    </div>

    <h2>Advanced 3D Transform</h2>
    <div class="perspective-container">
      <div class="box box-advanced-3d">3D Box</div>
    </div>
  </body>
</html>
